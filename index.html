<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetalKit - Metallurgy Toolkit</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1d1d1f;--mute:#6b6b6b;--acc:#c2410c;--fer:#9ca3af;--pea:#c2410c;--cem:#1f2937;--bd:#e5e1da}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--card:#201d1a;--tx:#f2efea;--mute:#a09a90;--acc:#fb923c;--fer:#6b7280;--pea:#fb923c;--cem:#e5e7eb;--bd:#35302b}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0}.sub{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:16px 0}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number]{width:100%;box-sizing:border-box;padding:8px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.big{font-size:1.8rem;font-weight:700;color:var(--acc)}
.bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:10px 0;background:var(--bd)}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 6px 0 12px}
.go{padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.err{color:#dc2626}
[hidden]{display:none}
</style></head><body><main>
<h1>⚙️ MetalKit</h1>
<p class="sub">Metallurgy toolkit for Hacktoberfest 2026, built by a KNUST Metallurgical Engineering student.</p>
<div class="tabs"><button id="t1" class="on">Fe-C Steel Explorer</button><button id="t2">Tensile Test</button></div>

<section id="p1" class="card">
<label for="c">Carbon: <span class="big" id="cv">0.40</span> wt% C</label>
<input id="c" type="range" min="0" max="2.14" step="0.01" value="0.40">
<p><b id="kind"></b> <span class="sub" id="side"></span></p>
<p class="sub" id="use"></p>
<div class="bar" id="bar"></div><div id="leg"></div>
</section>

<section id="p2" class="card" hidden>
<label>Max force (N)<input id="f" type="number" value="20000"></label>
<label>Start diameter (mm)<input id="d0" type="number" value="10"></label>
<label>Final diameter (mm)<input id="df" type="number" value="7"></label>
<label>Start length (mm)<input id="l0" type="number" value="50"></label>
<label>Final length (mm)<input id="lf" type="number" value="62"></label>
<button class="go" id="calc">Calculate</button>
<p id="out"></p>
</section>
<p class="sub">Lever rule uses ferrite 0.022, eutectoid 0.76 and cementite 6.70 wt% C.</p>
</main>
<script>
var FMAX=0.022,EUT=0.76,CEM=6.70,$=function(i){return document.getElementById(i)};
function classify(c){
  var k,u;
  if(c<0.25){k="Low-carbon steel";u="Soft, easy to weld: car bodies, pipes, nails."}
  else if(c<0.60){k="Medium-carbon steel";u="Strong and tough: gears, axles, rails."}
  else{k="High-carbon steel";u="Hard, wear resistant: knives, springs, tools."}
  return{kind:k,use:u,side:c<EUT?"hypoeutectoid":(c===EUT?"eutectoid":"hypereutectoid")};
}
function fractions(c){
  if(c<=FMAX)return[{n:"Ferrite",v:100,k:"fer"}];
  if(c<EUT){var p=(c-FMAX)/(EUT-FMAX)*100;return[{n:"Proeutectoid ferrite",v:100-p,k:"fer"},{n:"Pearlite",v:p,k:"pea"}]}
  var q=(CEM-c)/(CEM-EUT)*100;return[{n:"Pearlite",v:q,k:"pea"},{n:"Proeutectoid cementite",v:100-q,k:"cem"}];
}
function tensile(F,d0,df,l0,lf){
  if(!(F>0&&d0>0&&df>0&&l0>0&&lf>0))throw new Error("All values must be numbers greater than zero.");
  var a0=Math.PI*d0*d0/4,af=Math.PI*df*df/4;
  return{stress:F/a0,elong:(lf-l0)/l0*100,ra:(a0-af)/a0*100};
}
function renderFeC(){
  var c=parseFloat($("c").value),r=classify(c),bar="",leg="";
  $("cv").textContent=c.toFixed(2);$("kind").textContent=r.kind;$("side").textContent="("+r.side+")";$("use").textContent=r.use;
  fractions(c).forEach(function(x){
    bar+='<div style="width:'+x.v+'%;background:var(--'+x.k+')">'+(x.v>12?x.v.toFixed(0)+'%':'')+'</div>';
    leg+='<span class="dot" style="background:var(--'+x.k+')"></span>'+x.n+': '+x.v.toFixed(1)+'%';
  });
  $("bar").innerHTML=bar;$("leg").innerHTML=leg;
}
function show(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}
$("t1").onclick=function(){show(1)};$("t2").onclick=function(){show(2)};
$("c").oninput=renderFeC;
$("calc").onclick=function(){
  var o=$("out");
  try{
    var r=tensile(+$("f").value,+$("d0").value,+$("df").value,+$("l0").value,+$("lf").value);
    o.className="";
    o.innerHTML="Stress: <b>"+r.stress.toFixed(2)+" MPa</b><br>Elongation: <b>"+r.elong.toFixed(2)+"%</b><br>Reduction of area: <b>"+r.ra.toFixed(2)+"%</b>";
  }catch(e){o.className="err";o.textContent=e.message}
};
renderFeC();
</script></body></html>
